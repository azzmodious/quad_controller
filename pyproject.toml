[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quad-controller"
version = "0.1.0"
description = "Raspberry Pi 5 companion computer software for an ArduPilot Pixhawk quadcopter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4.41",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
sitl = [
    "MAVProxy>=1.8.70",
]

[project.scripts]
quadctl = "quad_controller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quad_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sitl: needs a running ArduCopter SITL (set QC_SITL=1 to run)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
